<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera Management</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0e1513;color:#e3eae4;
    font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  .switcher{
    display:flex;align-items:stretch;background:#0b110f;
    border-bottom:1px solid #29362f;height:44px;
    -webkit-user-select:none;user-select:none
  }
  .brand{
    display:flex;align-items:center;padding:0 18px;
    color:#e3eae4;font-weight:600;font-size:14px;font-family:"Avenir Next","Avenir",-apple-system,sans-serif;
    border-right:1px solid #29362f
  }
  .brand .dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#e8c547;
    margin-right:8px
  }
  .tab{
    display:flex;align-items:center;padding:0 18px;cursor:pointer;
    color:#8b98a8;font-size:13px;font-weight:500;
    border-bottom:2px solid transparent;transition:color .15s,border-color .15s
  }
  .tab:hover{color:#e6edf3}
  .tab.active{color:#e6edf3}
  .tab[data-tab="newer"].active{border-bottom-color:#4cc9f0}
  .tab[data-tab="mid"].active{border-bottom-color:#52e8a0}
  .tab[data-tab="older"].active{border-bottom-color:#ff9933}
  .tab[data-tab="wh"].active{border-bottom-color:#e8c547}
  .tab[data-tab="wh"]{color:#cfd8d2;font-weight:600}
  .group-label{display:flex;align-items:center;padding:0 6px 0 18px;color:#5f6f67;font-size:12px;border-left:1px solid #29362f}
  .smsbar{display:none;align-items:center;gap:10px;padding:0 14px;height:34px;background:#141c18;border-bottom:1px solid #29362f;font-size:12px;color:#cfd8d2}
  .smsbar.show{display:flex}
  .smsbar button{background:#1f2a26;color:#e3eae4;border:1px solid #29362f;border-radius:5px;padding:3px 10px;font-size:12px;cursor:pointer}
  .smsbar b{color:#e8c547;font-weight:600}
  iframe.with-sms{height:calc(100vh - 78px)}
  .tab .pill{
    display:inline-block;font-size:10px;font-weight:600;
    padding:2px 6px;border-radius:3px;margin-left:8px;
    text-transform:uppercase;letter-spacing:.05em
  }
  .tab[data-tab="newer"] .pill{background:rgba(76,201,240,.15);color:#4cc9f0}
  .tab[data-tab="mid"]   .pill{background:rgba(82,232,160,.15);color:#52e8a0}
  .tab[data-tab="older"] .pill{background:rgba(255,153,51,.15);color:#ff9933}
  .spacer{flex:1}
  .ver{
    display:flex;align-items:center;padding:0 18px;
    color:#5a6675;font-size:11px
  }
  .update-bar{
    display:none;align-items:center;gap:10px;padding:0 14px;
    background:#1a2e1a;border-bottom:1px solid #2a4a2a;
    font-size:12px;color:#7ed957;height:30px;flex-shrink:0
  }
  .update-bar.show{display:flex}
  .update-bar button{
    background:#4cc9f0;color:#0a1014;border:0;border-radius:4px;
    padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer
  }
  iframe{
    width:100%;border:0;display:block;background:#0f1419;
    height:calc(100vh - 44px)
  }
  iframe.with-bar{height:calc(100vh - 74px)}
</style>
</head>
<body>
<div class="switcher">
  <div class="brand"><span class="dot"></span>Camera Management</div>
  <div class="tab active" data-tab="wh" data-src="warehouse.html">Cameras</div>
  <div class="group-label">SMS builders</div>
  <div class="tab" data-tab="newer" data-src="willfine_T4.0CG.html">
    T4.0CG <span class="pill">new</span>
  </div>
  <div class="tab" data-tab="mid" data-src="willfine_4.0P.html">
    4.0P <span class="pill">Pro</span>
  </div>
  <div class="tab" data-tab="older" data-src="willfine_4.0CG.html">
    4.0CG <span class="pill">PNY</span>
  </div>
  <div class="spacer"></div>
  <div class="ver" id="appVer">v1.0.4</div>
</div>
<div class="update-bar" id="updateBar">
  <span id="updateMsg"></span>
</div>
<div class="smsbar" id="smsbar"><button id="smsBack">← Cameras</button><span id="smsFor"></span></div>
<iframe id="frame" src="warehouse.html" title="Camera Management" allow="camera *"></iframe>
<script>
  const tabs = document.querySelectorAll('.tab');
  const frame = document.getElementById('frame');
  function activate(src) {
    tabs.forEach(x => x.classList.toggle('active', x.dataset.src === src));
    frame.src = src;
  }
  function hideSmsBar() { document.getElementById('smsbar').classList.remove('show'); frame.classList.remove('with-sms'); }
  tabs.forEach(t => t.addEventListener('click', () => { hideSmsBar(); activate(t.dataset.src); }));
  // Called by the Cameras page: open the SMS builder for one camera.
  window.openSms = (page, cam) => {
    activate(page);
    const bar = document.getElementById('smsbar'), who = document.getElementById('smsFor');
    who.textContent = '';
    who.append('SMS commands for ');
    const b = document.createElement('b'); b.textContent = cam && cam.name ? cam.name : 'this camera'; who.append(b);
    if (cam && cam.simPhone) who.append(' — send them to ' + cam.simPhone);
    bar.classList.add('show'); frame.classList.add('with-sms');
  };
  document.getElementById('smsBack').onclick = () => { hideSmsBar(); activate('warehouse.html'); };

  // Version display
  if (window.electronAPI) {
    window.electronAPI.getVersion().then(v => {
      document.getElementById('appVer').textContent = 'v' + v;
    }).catch(() => {});
  }

  // Auto-update status — info-only, install happens on app close
  function showBar(msg) {
    const bar = document.getElementById('updateBar');
    bar.classList.add('show');
    frame.classList.add('with-bar');
    document.getElementById('updateMsg').textContent = msg;
  }
  if (window.electronAPI && window.electronAPI.onUpdateStatus) {
    window.electronAPI.onUpdateStatus(info => {
      if (info.state === 'downloading') showBar('Downloading update ' + info.version + '…');
      else if (info.state === 'ready')  showBar('Update ' + info.version + ' will install when you close the app.');
      else if (info.state === 'error')  showBar('Update download failed: ' + info.message);
    });
  }
</script>
</body>
</html>
