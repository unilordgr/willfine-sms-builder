<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Warehouse — Willfine SD Card</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a2028; --panel2:#222a34; --ink:#e6edf3;
    --muted:#8b98a8; --line:#2a3340; --accent:#c792ea; --ok:#7ed957;
    --warn:#f9a03f; --danger:#e05a5a; --field:#0b1016;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
  button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:7px 12px}
  button:hover{border-color:#3a4656}
  button.primary{background:var(--accent);border-color:var(--accent);color:#170c20;font-weight:600}
  button.ok{background:var(--ok);border-color:var(--ok);color:#0c1a05;font-weight:600}
  button.danger{color:var(--danger)}
  button:disabled{opacity:.45;cursor:default}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--field);
    border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(199,146,234,.45);border-color:var(--accent)}
  input:disabled,select:disabled{opacity:.45}
  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
  /* sidebar */
  .side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#0c1116}
  .side-top{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
  .side-top .row{display:flex;gap:8px}
  .side-top .row > *{flex:1}
  .list{overflow:auto;flex:1}
  .item{padding:10px 12px;border-bottom:1px solid #1a222c;cursor:pointer}
  .item:hover{background:#141b23}
  .item.sel{background:#1d1626;box-shadow:inset 3px 0 var(--accent)}
  .item .n{font-weight:600}
  .item .m{color:var(--muted);font-size:11px;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;
    background:rgba(199,146,234,.15);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
  .side-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  .side-foot button{padding:5px 8px;font-size:12px}
  .count{color:var(--muted);font-size:11px}
  /* main */
  .main{overflow:auto;min-width:0}
  .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);flex-direction:column;gap:12px;text-align:center;padding:20px}
  .empty h2{color:var(--ink);margin:0;font-size:18px}
  .head{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;background:var(--panel)}
  .head label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .head input,.head select{font-size:14px}
  .head .name input{font-size:16px;font-weight:600}
  .sdbar{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#141a21}
  .sdbar select{min-width:220px}
  .sdbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  .status{padding:0 20px;min-height:0}
  .msg{margin:10px 0 0;padding:8px 12px;border-radius:6px;font-size:12px;border-left:3px solid}
  .msg.ok{background:#14240f;border-color:var(--ok);color:#b9e9a0}
  .msg.err{background:#2a1414;border-color:var(--danger);color:#f2b0b0}
  .msg.info{background:#1d1626;border-color:var(--accent);color:#ddc6f0}
  .tabs{display:flex;gap:2px;padding:14px 20px 0;border-bottom:1px solid var(--line)}
  .tabs .t{padding:8px 14px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:center}
  .tabs .t.active{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .tabs .t input{margin:0}
  .pane{padding:16px 20px 40px}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
  .grp h3{margin:0;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:2px 18px;padding:10px 14px}
  .f{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;padding:5px 0}
  .f > span{color:#c3ccd6}
  .f .ctl{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
  .f .ctl > input[type=text],.f .ctl > input[type=password],.f .ctl > select{flex:1}
  .f .hint{grid-column:2;color:var(--muted);font-size:11px;margin-top:-2px}
  .onoff{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:none}
  .onoff button{border:0;border-radius:0;padding:5px 10px;background:var(--field);color:var(--muted)}
  .onoff button.on{background:var(--accent);color:#170c20;font-weight:600}
  .pics label{display:inline-flex;gap:3px;align-items:center;color:#c3ccd6}
  .note{color:var(--muted);font-size:12px;padding:0 14px 10px}
  .notapplied{opacity:.55}
  /* scanner modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10}
  .modal.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,94vw);padding:16px;display:flex;flex-direction:column;gap:12px}
  .card h2{margin:0;font-size:16px}
  .video{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3}
  .video video{width:100%;height:100%;object-fit:cover;display:block}
  .video .aim{position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
  .video .lbl{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;text-shadow:0 1px 3px #000;font-size:12px}
  .card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card .row input{flex:1;font-size:15px;letter-spacing:.04em}
  .found{font-size:13px;padding:10px;border-radius:6px;background:#1d1626;border:1px solid #3b2a4c}
  .found b{color:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-top">
      <button class="primary" id="btnScan">📷 Scan camera barcode</button>
      <button id="btnAdd">+ Add manually</button>
      <input id="search" type="search" placeholder="Search name, IMEI, ID, model…">
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <span class="count" id="count"></span>
      <span style="flex:1"></span>
      <button id="btnExport" title="Export all cameras to a JSON file">Export</button>
      <button id="btnImport" title="Import cameras from a JSON file">Import</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="scanModal">
  <div class="card">
    <h2>Scan the barcode on the camera</h2>
    <div class="video" id="videoBox">
      <video id="video" playsinline muted></video>
      <div class="aim"></div>
      <div class="lbl" id="scanLbl">Starting camera…</div>
    </div>
    <div class="row">
      <select id="camSelect" title="Webcam"></select>
      <button id="btnImg" title="Decode a photo of the label instead">From photo…</button>
      <input type="file" id="imgFile" accept="image/*" hidden>
    </div>
    <div class="note" style="padding:0">Tip: the built-in Mac camera can't focus close up. An iPhone near your Mac shows up in the camera list (Continuity Camera) and reads labels much better — or use <b>From photo…</b> with a phone picture.</div>
    <div class="row">
      <input id="code" class="mono" placeholder="…or type the 15-digit number" inputmode="numeric">
    </div>
    <div id="found" class="found" hidden></div>
    <div class="row" style="justify-content:flex-end">
      <button id="btnCancelScan">Cancel</button>
      <button class="primary" id="btnUseCode" disabled>Add camera</button>
    </div>
  </div>
</div>

<script src="sdcard/models.js"></script>
<script src="sdcard/codec.js"></script>
<script src="sdcard/vendor/zxing.min.js"></script>
<script>
'use strict';
const MODELS = window.WF_MODELS, CODEC = window.WF_CODEC;
const API = (() => {
  try { if (window.electronAPI) return window.electronAPI; } catch (_) {}
  try { if (window.parent && window.parent.electronAPI) return window.parent.electronAPI; } catch (_) {}
  return null;
})();
const DEFAULT_MODEL = 'T4.0CG';
const ID_DIGITS = 12;        // camera firmware accepts exactly 12 characters

// ── helpers ──────────────────────────────────────────────
const $ = s => document.querySelector(s);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const digits = s => String(s || '').replace(/\D/g, '');
const fmtDate = t => t ? new Date(t).toLocaleString() : '—';
const clone = o => JSON.parse(JSON.stringify(o));

// ── store ────────────────────────────────────────────────
let DB = { version: 1, cameras: [] };
let selId = null, curTab = 1, saveTimer = null;
async function loadDB() {
  if (API) DB = await API.whLoad();
  else { try { DB = JSON.parse(localStorage.getItem('wf_warehouse')) || DB; } catch (_) {} }
}
function saveDB(now) {
  clearTimeout(saveTimer);
  const go = async () => {
    try { if (API) await API.whSave(DB); else localStorage.setItem('wf_warehouse', JSON.stringify(DB)); }
    catch (e) { flash('err', 'Could not save warehouse: ' + e.message); }
  };
  if (now) return go();
  saveTimer = setTimeout(go, 400);
}
const cam = () => DB.cameras.find(c => c.id === selId);

function newCamera({ imei = '', cameraId = '', model = DEFAULT_MODEL, name } = {}) {
  const m = MODELS[model];
  const settings = CODEC.defaults(m);
  if (cameraId) { settings.tbCameraID = cameraId; settings.cbCameraID = false; } // ID ON
  const n = DB.cameras.length + 1;
  return {
    id: uid(), name: name || ('Camera ' + String(n).padStart(2, '0')),
    imei, cameraId, model, modify: 7, settings, notes: '',
    createdAt: Date.now(), updatedAt: Date.now(), lastWrite: null,
  };
}

// Keep values whose control exists in the new model; reset the rest to defaults.
function switchModel(c, model) {
  const m = MODELS[model], d = CODEC.defaults(m), out = {};
  for (const f of m.fields) {
    const k = CODEC.ctlKey(f);
    out[k] = (k in c.settings && valid(m, f, c.settings[k])) ? c.settings[k] : d[k];
  }
  c.model = model; c.settings = out;
}
function valid(m, f, v) {
  if (f.kind === 'select') return Number.isInteger(v) && v >= 0 && (!m.labels[f.ctl] || v < m.labels[f.ctl].length || f.ctl === 'cbOperators');
  if (f.kind === 'tz') return Number.isInteger(v) && v >= 0 && v < f.values.length;
  return v !== undefined;
}

function idFromImei(imei) { const d = digits(imei); return d.length >= ID_DIGITS ? d.slice(-ID_DIGITS) : d; }

// IMEIs end in a Luhn check digit, so a misread digit is almost always caught.
function luhnOk(n) {
  let s = 0;
  for (let i = 0; i < n.length; i++) {
    let d = +n[n.length - 1 - i];
    if (i % 2) { d *= 2; if (d > 9) d -= 9; }
    s += d;
  }
  return n.length > 0 && s % 10 === 0;
}
// Find a valid 15-digit IMEI in OCR text (fixes the usual letter/digit mix-ups).
function imeiFromText(texts) {
  const fix = { O: '0', o: '0', D: '0', Q: '0', U: '0', I: '1', l: '1', i: '1', '|': '1', '!': '1', L: '1', Z: '2', z: '2', S: '5', s: '5', G: '6', b: '6', T: '7', B: '8', g: '9', q: '9' };
  for (const raw of texts || []) {
    const runs = String(raw).replace(/[OoDQUIli|!LZzSsGbTBgq]/g, c => fix[c]).replace(/[\s.\-]/g, '').match(/\d{15,}/g) || [];
    for (const r of runs) for (let k = 0; k + 15 <= r.length; k++) { const w = r.slice(k, k + 15); if (luhnOk(w)) return w; }
  }
  return null;
}

// ── UI: messages ─────────────────────────────────────────
function flash(kind, text) {
  const box = $('#status'); if (!box) return;
  box.innerHTML = ''; box.append(el('div', { class: 'msg ' + kind }, text));
  if (kind !== 'err') setTimeout(() => { if (box.firstChild && box.firstChild.textContent === text) box.innerHTML = ''; }, 6000);
}

// ── UI: list ─────────────────────────────────────────────
function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#list'); list.innerHTML = '';
  const cams = DB.cameras.filter(c => !q || [c.name, c.imei, c.cameraId, c.model, c.notes].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  for (const c of cams) {
    list.append(el('div', { class: 'item' + (c.id === selId ? ' sel' : ''), onclick: () => select(c.id) },
      el('div', { class: 'n' }, c.name || '(no name)'),
      el('div', { class: 'm' }, el('span', { class: 'mono' }, c.imei || c.cameraId || 'no code'), el('span', { class: 'badge' }, c.model)),
      el('div', { class: 'm' }, el('span', {}, c.lastWrite ? 'SD written ' + fmtDate(c.lastWrite) : 'never written'))));
  }
  if (!cams.length) list.append(el('div', { class: 'note', style: 'padding:16px' }, DB.cameras.length ? 'No match.' : 'No cameras yet — scan one to start.'));
  $('#count').textContent = DB.cameras.length + ' camera' + (DB.cameras.length === 1 ? '' : 's');
}

function select(id) { selId = id; renderList(); renderMain(); }

// ── UI: detail ───────────────────────────────────────────
const EXTRA_NAMES = { cbMMSSwitch: 'MMS Switch', rbEncrypt: 'SMTP Encryption', PCBit: 'SMTP/FTP Pic Count', tbDateTime: 'Set camera clock' };
const PAIRS = { // ON/OFF switch → the value it enables
  cbDailyReport: 'dtpDailyReport', cbTimeLapse: 'dtpTimeLapse', cbDelay: 'dtpDelay', cbTimer: 'dtpTimerStart',
  cbTimer2: 'dtpTimer2Start', cbCameraID: 'tbCameraID', cbPassword: 'tbPassword', cbDateTime: 'tbDateTime', cbTZSwitch: 'cbTimeZone',
};
const PAIRED = new Set(Object.values(PAIRS));
const GROUPS = [
  ['Network', k => /^(cb3G|cbSIM|cbCountry|cbOperators|cbGPS|cbSMSCtrl|nudMMSMax|cbDailyReport|dtpDailyReport|cbSMSWarning|tSMSPhone)/.test(k)],
  ['Photo sending', k => /^(cbPicSize|cbTransPhoto|cbTransVideo|PCBit|cbMMSSwitch)/.test(k)],
  ['MMS', k => /^tMMS/.test(k)],
  ['Mobile data (GPRS / APN)', k => /^tGPRS/.test(k)],
  ['Email (SMTP)', k => /^(cbSMTPSwitch|tSMTP|rbEncrypt)/.test(k)],
  ['FTP', k => /^(cbFTP|tFTP)/.test(k)],
  ['Send to', k => /^(tPhone|tEmail)/.test(k)],
];
const SECRET = /Password$/;

function fieldName(m, k) { return m.names[k] || EXTRA_NAMES[k] || k; }

function renderMain() {
  const c = cam(), main = $('#main'); main.innerHTML = '';
  if (!c) {
    main.append(el('div', { class: 'empty' },
      el('h2', {}, DB.cameras.length ? 'Pick a camera' : 'Your camera warehouse'),
      el('div', {}, 'Scan the barcode inside a camera to add it. Each camera keeps its own name, type and SD-card settings.'),
      el('button', { class: 'primary', onclick: openScanner }, '📷 Scan camera barcode')));
    return;
  }
  const m = MODELS[c.model];
  const touch = () => { c.updatedAt = Date.now(); saveDB(); };

  // header
  const modelSel = el('select', { onchange: e => {
    if (!confirm('Change camera type to ' + MODELS[e.target.value].name + '? Settings that the new type does not have will reset.')) { e.target.value = c.model; return; }
    switchModel(c, e.target.value); touch(); renderList(); renderMain();
  } }, Object.entries(MODELS).map(([k, v]) => el('option', { value: k, selected: k === c.model }, v.name)));
  const imeiIn = el('input', { class: 'mono', value: c.imei, placeholder: '15-digit IMEI', oninput: e => {
    c.imei = digits(e.target.value); const id = idFromImei(c.imei);
    if (id.length === ID_DIGITS) { c.cameraId = id; c.settings.tbCameraID = id; idIn.value = id; }
    touch(); renderList();
  } });
  const idIn = el('input', { class: 'mono', value: c.cameraId, maxlength: ID_DIGITS, oninput: e => {
    c.cameraId = e.target.value.replace(/[^0-9A-Za-z]/g, '').slice(0, ID_DIGITS); e.target.value = c.cameraId;
    c.settings.tbCameraID = c.cameraId; touch(); renderList();
  } });
  main.append(el('div', { class: 'head' },
    el('label', { class: 'name' }, 'Name', el('input', { value: c.name, oninput: e => { c.name = e.target.value; touch(); renderList(); } })),
    el('label', {}, 'Camera type', modelSel),
    el('label', {}, 'IMEI (scanned)', imeiIn),
    el('label', {}, 'Camera ID (last 12 digits)', idIn),
    el('label', {}, 'Notes', el('input', { value: c.notes || '', placeholder: 'location, owner…', oninput: e => { c.notes = e.target.value; touch(); } }))));

  // SD bar
  const volSel = el('select', { id: 'volSel' });
  main.append(el('div', { class: 'sdbar' },
    el('span', { style: 'color:var(--muted)' }, 'SD card:'), volSel,
    el('button', { onclick: refreshVolumes, title: 'Look for cards again' }, '↻'),
    el('button', { class: 'ok', onclick: writeSD }, 'Write to SD card'),
    el('button', { onclick: () => readSD(true), title: 'Load a Parameter.cfg that is still on the card (the camera may delete it after loading)' }, 'Load from SD'),
    el('span', { class: 'sep' }),
    el('button', { onclick: saveFile }, 'Save .cfg…'),
    el('button', { onclick: loadFile }, 'Load .cfg…'),
    el('button', { onclick: copyFrom }, 'Copy settings from…'),
    el('span', { style: 'flex:1' }),
    el('span', { class: 'count' }, 'Last written: ' + fmtDate(c.lastWrite)),
    el('button', { class: 'danger', onclick: () => {
      if (!confirm('Delete "' + c.name + '" from the warehouse?')) return;
      DB.cameras = DB.cameras.filter(x => x.id !== c.id); selId = null; saveDB(true); renderList(); renderMain();
    } }, 'Delete')));
  main.append(el('div', { class: 'status', id: 'status' }));
  refreshVolumes();

  // tabs
  const tabs = el('div', { class: 'tabs' });
  m.tabTitles.forEach((title, i) => {
    const bit = [1, 2, 4][i];
    const chk = el('input', { type: 'checkbox', checked: !!(c.modify & bit), title: 'Apply this tab when the camera reads the card', onclick: e => e.stopPropagation(),
      onchange: e => { c.modify = e.target.checked ? (c.modify | bit) : (c.modify & ~bit); touch(); renderMain(); } });
    tabs.append(el('div', { class: 't' + (curTab === bit ? ' active' : ''), onclick: () => { curTab = bit; renderMain(); } }, chk, title || ['Network', 'Camera', 'Other'][i]));
  });
  main.append(tabs);

  const pane = el('div', { class: 'pane' + ((c.modify & curTab) ? '' : ' notapplied') });
  if (!(c.modify & curTab)) pane.append(el('div', { class: 'msg info', style: 'margin:0 0 12px' }, 'This tab is not ticked — the camera will ignore these settings. Tick the box on the tab to apply them.'));
  const fields = m.fields.filter(f => (m.tabs[CODEC.ctlKey(f)] || 1) === curTab && !PAIRED.has(CODEC.ctlKey(f)));
  if (curTab === 1) {
    const used = new Set();
    for (const [title, test] of GROUPS) {
      const fs = fields.filter(f => !used.has(f) && test(CODEC.ctlKey(f)));
      fs.forEach(f => used.add(f));
      if (fs.length) pane.append(group(title, fs, c, m, touch));
    }
    const rest = fields.filter(f => !used.has(f));
    if (rest.length) pane.append(group('More', rest, c, m, touch));
  } else {
    pane.append(group(curTab === 2 ? 'Camera' : 'Other', fields, c, m, touch));
  }
  main.append(pane);
}

function group(title, fields, c, m, touch) {
  const g = el('div', { class: 'grp' }, el('h3', {}, title));
  const grid = el('div', { class: 'grid' });
  for (const f of fields) grid.append(fieldRow(f, c, m, touch));
  g.append(grid);
  return g;
}

function timeInput(val, withSec, onchange, disabled) {
  const v = String(val || '000000');
  const fmt = v.slice(0, 2) + ':' + v.slice(2, 4) + (withSec ? ':' + v.slice(4, 6) : '');
  return el('input', { type: 'time', step: withSec ? 1 : 60, value: fmt, disabled,
    onchange: e => { const p = (e.target.value || '00:00:00').split(':'); onchange((p[0] || '00') + (p[1] || '00') + (withSec ? (p[2] || '00') : '00')); } });
}

function valueControl(f, c, m, touch, disabled) {
  const k = CODEC.ctlKey(f), s = c.settings;
  const set = v => { s[k] = v; touch(); };
  const labels = m.labels[f.ctl] || [];
  switch (f.kind) {
    case 'select': {
      let opts = labels;
      if (k === 'cbOperators') opts = ((m.operators[s.cbCountry] || {}).operators || []).map(o => o.name);
      const sel = el('select', { disabled, onchange: e => {
        set(+e.target.value);
        if (k === 'cbCountry') { s.cbOperators = 0; applyOperator(c, m); renderMain(); }
        if (k === 'cbOperators') { applyOperator(c, m); renderMain(); }

// ── SD card ──────────────────────────────────────────────

  const key = keys.includes(c.model) ? c.model : keys[0];
  const d = CODEC.decode(MODELS[key], bytes);
  if (key !== c.model && !confirm('This config is for ' + MODELS[key].name + ', but "' + c.name + '" is set as ' + MODELS[c.model].name + '. Change the camera type?')) return false;
  c.model = key; c.settings = d.values; c.modify = d.modify || 7;

// Read the card. fromDetail=true → load into the selected camera (with matching check).
async function readSD(fromDetail) {
  if (!API) return alert('SD access needs the desktop app.');
  let vols = await refreshVolumes();
  if (!fromDetail) vols = await API.sdVolumes();
  const vol = fromDetail ? chosenVolume() : (vols.find(v => v.hasConfig) || vols[0] || {}).path;
  if (!vol) { if (!fromDetail) alert('No SD card found. Insert one and try again.'); return; }
  const bytes = await API.sdRead(vol);
  if (!bytes) { const msg = 'No Parameter.cfg on that card — the camera may have removed it after loading. The settings saved here are still the latest.'; fromDetail ? flash('info', msg) : alert(msg); return; }
  try {
    const owner = matchByFile(bytes);
    if (fromDetail) {
      const c = cam();
      if (owner && owner.id !== c.id && !confirm('This card belongs to "' + owner.name + '". Load its settings into "' + c.name + '" anyway?')) return;
      applyBytes(c, bytes, 'the SD card');
      return;
    }
    if (owner) {

      else flash('info', 'Opened "' + owner.name + '" (card camera ID matches).');

    const keys = CODEC.modelsFor(MODELS, bytes);
    if (!keys.length) return alert('This card has a config for an unknown camera type.');
    const d = CODEC.decode(MODELS[keys[0]], bytes);
    if (!confirm('No camera in the warehouse matches this card (ID ' + (d.values.tbCameraID || 'none') + '). Add it as a new ' + MODELS[keys[0]].name + '?')) return;
    const c = newCamera({ model: keys[0], cameraId: d.values.tbCameraID || '' });
    DB.cameras.push(c); selId = c.id; applyBytes(c, bytes, 'the SD card');
  } catch (e) { alert('Could not read the card: ' + e.message); }
}

}

      deviceId: deviceId ? { exact: deviceId } : undefined,

  } catch (e) { $('#scanLbl').textContent = cameraErrorText(e); return; }

  if (!scanCore) {

  if (ocrOn && !ocrBusy && v.videoWidth) {
    ocrBusy = true;
    try {
      const cv = document.createElement('canvas');
      const sx = v.videoWidth * 0.04, sw = v.videoWidth * 0.92, sy = v.videoHeight * 0.2, sh = v.videoHeight * 0.6;

            const band = document.createElement('canvas'); band.width = Math.round(x1 - x0); band.height = bh;
            band.getContext('2d').drawImage(full, x0, y, x1 - x0, bh, 0, 0, x1 - x0, bh);
            const t = tryCanvas(band); if (t && digits(t).length >= ID_DIGITS) return t;
          }
        }
        await new Promise(r => setTimeout(r)); // keep the window responsive
      }
    }
  }
  return null;
}
function useCode() {
  const id = idFromImei(scanCode);
  const existing = DB.cameras.find(c => (c.imei && c.imei === scanCode) || c.cameraId === id);
  if (existing) { closeScanner(); select(existing.id); return; }
  const model = ($('#newModel') || {}).value || DEFAULT_MODEL;
  const c = newCamera({ imei: scanCode.length >= 15 ? scanCode : '', cameraId: id, model, name: ($('#newName') || {}).value });
  DB.lastModel = model; DB.cameras.push(c); saveDB(true);
  closeScanner(); select(c.id);
  flash('ok', 'Added "' + c.name + '" with Camera ID ' + id + '. Adjust its settings, then write the SD card.');
}

// ── wire up ──────────────────────────────────────────────
$('#btnScan').onclick = openScanner;
$('#btnAdd').onclick = () => { const c = newCamera({ model: DB.lastModel || DEFAULT_MODEL }); DB.cameras.push(c); saveDB(true); select(c.id); };
$('#search').oninput = renderList;
$('#btnCancelScan').onclick = closeScanner;
$('#btnUseCode').onclick = useCode;
$('#code').oninput = e => setCode(e.target.value);
$('#code').onkeydown = e => { if (e.key === 'Enter' && !$('#btnUseCode').disabled) useCode(); };
$('#camSelect').onchange = e => startStream(e.target.value);
$('#btnImg').onclick = () => $('#imgFile').click();
$('#imgFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#scanLbl').textContent = 'Reading photo…';
  let t = await decodeImageFile(f); e.target.value = '';
  if (!t && API && API.ocrRead && await API.ocrAvailable().catch(() => false)) {
    $('#scanLbl').textContent = 'No barcode found — reading the printed number…';
    t = imeiFromText(await ocrImage(f));
  }
  if (t) { setCode(t); $('#scanLbl').textContent = '✓ Read ' + digits(t) + ' from photo'; }
  else $('#scanLbl').textContent = 'No barcode found in that photo — try a closer, straighter shot.';
};
$('#btnExport').onclick = async () => {
  const text = JSON.stringify(DB, null, 1);
  if (API) { const p = await API.exportJson(text, 'warehouse-' + new Date().toISOString().slice(0, 10) + '.json'); if (p) alert('Exported to ' + p); }
};
$('#btnImport').onclick = async () => {
  if (!API) return;
  const text = await API.importJson(); if (!text) return;
  try {
    const d = JSON.parse(text); if (!Array.isArray(d.cameras)) throw new Error('No cameras in file');
    let added = 0;
    for (const c of d.cameras) {
      if (!MODELS[c.model] || DB.cameras.some(x => x.id === c.id || (c.imei && x.imei === c.imei))) continue;
      DB.cameras.push(c); added++;
    }
    saveDB(true); renderList(); alert('Imported ' + added + ' camera(s). Duplicates were skipped.');
  } catch (e) { alert('Import failed: ' + e.message); }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#scanModal').classList.contains('show')) closeScanner(); });

(async () => { await loadDB(); renderList(); renderMain(); })();
</script>
</body>
</html>
